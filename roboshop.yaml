- name: install Roboshop instances
  hosts: local
  connection: local
  vars: 
   instance: ["mongodb"]
  tasks:
   name: create an ec2 instance
   amazon.aws.ec2_instance:
    name: "[roboshop-{{ item }}]"
    instance_type: t3.micro
    image_id: ami-0220d79f3f480ecf5
    security_groups:
     - "roboshop-{{ item }}"
     - roboshop-ui
  loops: "{{ instance }}"
  register: ec2_output

- name: print ec2_output
  debug:
   msg: "{{ec2_output}}"
