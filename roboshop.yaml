- name: roboshop dbnodes
  hosts: local
  connection: local
  vars:
   instance: ["redis", "mysql", "rabbitmq"]
  
  tasks:
   - name: create dbnodes
     amazon.aws.ec2_instance:
     instance_type: t3.micro
     image_id: ami-0220d79f3f480ecf5
     instance_name: "roboshop-{{ item }}"
     loop: "{{ instance }}"
     register: ec2_output

   - name: printing output
     debug:
       msg: "{{ ec2_output }}"

    