- name: roboshop All nodes
  hosts: local
  connection: local
  vars:
   instance: [ "Mongodb", "Redis", "MySql", "RabbitMQ", "Catalogue", "User", "Cart", "Shipping", "Payments" ]
   frontend_instance: ["UI"]
   image_id: ami-0220d79f3f480ecf5
   domain_name: devopsaium.online
   action: create
  tasks:
   - name: create ec2 node
     amazon.aws.ec2_instance:
      image_id: "{{ image_id }}"
      instance_type: t3.micro
      name: "Roboshop-{{ item }}"
      security_groups:
       - "Roboshop-UI"
       - "Roboshop-{{ item }}"
      wait: false
     loop: "{{ instance }}"
     register: ec2_output
     when:
      - action == "create"

   - name: print ec2_output
     debug:
      msg: "{{ ec2_output }}"
    
   - name: create 53 records for Db and app nodes
     amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address}}"
      overwrite: true
     loop: "{{ ec2_output.results}}"
     when:
      - item.item == " instance"
      - action == " create"
  
   - name: create 53 records for frontend
     amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instance [0].public_ip_address }}"
      overwrite: true
     loop: "{{ ec2_output.results }}"
     when: 
      - item.item == "frontend_instance"
      - action == "create"


      

 