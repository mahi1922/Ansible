- name: Config Cart service
  hosts: Cart
  become: yes
  tasks:
   - name: enable nodejs 20
     command: dnf module enable nodejs:20 -y
   - name: Instll NodeJS
     package:
      name: nodejs
      state: present
   - name: create system user
     user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System user"
   - name: create app directory
     file:
      name: /app
      state: directory
   - name: download cart code
     get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip 
      dest: /tmp/cart.zip
   - name: unzip cart
     unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes
   - name: install dependencies
     community.general.npm:
      path: /app
   - name: copy cart service
     template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service
      
   - name: daemon reload
     systemd:
      daemon_reload: true
   - name: enable and start cart
     systemd:
      name: cart
      state: started
      enabled: yes
