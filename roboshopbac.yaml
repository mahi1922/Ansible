- name: roboshop backend nodes
  hosts: local
  connection: local
  vars: 
   instance: ["catalogue", "user", "cart", "shipping", "payment"]
  tasks:
   - name: create backend nodes
     amazon.aws.ec2_instance:
      instance_type: t3.micro
      image_id: ami-0220d79f3f480ecf5
      security_groups:
       - Roboshop-UI
     instance_name: "roboshop-{{ item }}" 
     loop: "{{ instance}}"
     register: ec2_output
    
   - name: print output
     debug:
      msg: "{{ ec2_output}}"