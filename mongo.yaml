- name: config mongodb
  hosts: Mongodb
  become: yes
  tasks:
   - name: copy mongo repo
     copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

   - name: Install mongoDB server
     package: 
      - name: mongodb-org
     state: present
   - name: allow remote connection
     replace:
      path:  /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

   - name:
      service: 
       name: mongod
       state: started
       enabled: yes

  